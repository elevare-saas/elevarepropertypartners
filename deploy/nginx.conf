# nginx in front of Elevare: HTTPS for the domain, everything forwarded to the Node app on port 4000.
# Copy to /etc/nginx/sites-available/elevare, link it into sites-enabled, then:
#   sudo certbot --nginx -d elevarepropertypartners.com -d www.elevarepropertypartners.com
#   sudo nginx -t && sudo systemctl reload nginx
# (certbot adds the ssl_certificate lines and the http → https redirect.)

upstream elevare_app {
  server 127.0.0.1:4000;
  keepalive 16;
}

# bare domain → www (one canonical address for search engines)
server {
  listen 80;
  listen [::]:80;
  server_name elevarepropertypartners.com;
  return 301 https://www.elevarepropertypartners.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.elevarepropertypartners.com;

  # listing photo uploads are up to 8 MB (UPLOAD_MAX_MB)
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # website (/), API (/api), uploads and sitemap all come from the app
  location / {
    proxy_pass http://elevare_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
