<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elevare Property Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Elevare Property Partners: black ground, violet → pink → sky gradient from the mark */
:root{
  color-scheme:dark;
  --bg:#050409; --surface:#110E18; --surface-2:#1A1624; --line:#2A2436; --ink:#F5F2FA; --muted:#A79FB6; --faint:#6E6680;
  --violet:#7A3FE0; --pink:#E05CB5; --sky:#55B6F2; --grad:linear-gradient(100deg,#7A3FE0 0%,#C04FD0 45%,#E05CB5 70%,#55B6F2 100%);
  --good:#6FD39A; --wa:#25B864; --wa-ink:#04160B;
  --wordmark:"Cinzel","Trajan Pro",Georgia,serif;
  --display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px;min-height:100%}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;background:radial-gradient(closest-side,rgba(122,63,224,.22),transparent 70%),radial-gradient(closest-side at 80% 30%,rgba(85,182,242,.12),transparent 70%);pointer-events:none;z-index:0}
.wrap{max-width:760px;margin-inline:auto;position:relative;z-index:1}
h1,h2{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand img{width:46px;height:auto;display:block}
.brand b{display:block;font-family:var(--wordmark);font-weight:500;font-size:20px;letter-spacing:.14em;line-height:1}
.brand small{display:flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:.3em;color:var(--muted);margin-top:5px}
.brand small::before,.brand small::after{content:"";width:12px;height:1px;background:var(--faint)}
.back{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted)}
.back:hover{color:var(--ink);border-color:var(--muted)}
.progress{display:grid;gap:8px;padding-block:4px 18px}
.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.track{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--grad);transition:width .45s ease}

/* brief strip */
.brief{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:18px}
.brief button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.brief button:hover{color:var(--ink);border-color:var(--violet)}
.brief button b{color:var(--ink);font-weight:600}

/* concierge bubble */
.say{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;margin-bottom:18px}
.say .av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.say .av img{width:26px}
.say p{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14px;color:var(--ink)}
.say p em{font-style:normal;color:var(--pink)}

.screen{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{font-size:clamp(30px,6vw,46px);margin-bottom:6px}
.qsub{color:var(--muted);margin:0 0 22px;max-width:56ch}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;display:grid;gap:3px;transition:border-color .15s,transform .15s,background .15s}
.opt:hover{border-color:var(--violet);transform:translateY(-1px)}
.opt b{font-size:15px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt[aria-pressed="true"]{background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,var(--grad) border-box;border-color:transparent}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:12px;right:14px;font-weight:700;color:var(--pink)}
.opt.wide{grid-column:1/-1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.chip.add::before{content:"+ ";color:var(--pink);font-weight:700}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.pair{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.box label,.box .l{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
.stepper output{font-family:var(--display);font-size:38px;line-height:1}
input[type="date"],input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
input[type="range"]{width:100%;accent-color:var(--pink)}
.bigval{font-family:var(--display);font-size:40px;line-height:1}
.hint{font-size:12px;color:var(--faint)}

.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.cta{border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:15px;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 8px 30px rgba(192,79,208,.35);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.cta:hover{filter:brightness(1.08)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ghost{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* welcome */
.hero{padding-block:18px 8px;display:grid;gap:16px}
.hero .mark{width:120px;max-width:100%}
.hero h1{font-size:clamp(38px,8vw,64px)}
.hero p{margin:0;color:var(--muted);font-size:16px;max-width:52ch}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-block:26px 14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ask{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ask textarea{width:100%;border:0;background:transparent;resize:none;min-height:52px;font-size:16px;outline:none}
.ask-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.understood{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);align-items:center}
.tag{padding:2px 9px;border-radius:999px;background:rgba(122,63,224,.2);color:#D9C7FF;font-weight:600;font-size:12px}
.suggest{position:absolute;left:10px;right:10px;top:calc(100% - 4px);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;list-style:none;margin:0;padding:4px;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.suggest li{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.suggest li small{color:var(--muted)}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--line)}
.ideas{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
@media (max-width:560px){.proof{grid-template-columns:1fr}}
.proof div{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.proof b{display:block;color:var(--ink);font-size:13.5px}

/* matching */
.scan{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.scan li{display:flex;gap:10px;align-items:center;color:var(--muted);opacity:.25;transition:opacity .3s}
.scan li.on{opacity:1;color:var(--ink)}
.scan li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad)}

/* match */
.card{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.art{aspect-ratio:16/8;max-width:100%;position:relative}
.art svg{display:block;width:100%;height:100%}
.pill{position:absolute;top:12px;left:12px;background:rgba(5,4,9,.75);color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;backdrop-filter:blur(4px)}
.pill.r{left:auto;right:12px;font-weight:600;font-size:11px}
.card-b{padding:18px 20px 20px;display:grid;gap:14px}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ttl h2{font-size:34px}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.price{text-align:right}
.price .big{font-size:24px}
.price small{display:block;color:var(--muted);font-size:12px}
.fits{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.fits li::before{content:"✓ ";color:var(--good);font-weight:700}
.fits li.miss{color:var(--muted)}
.fits li.miss::before{content:"◌ ";color:var(--muted)}
.compare{background:var(--surface-2);border-radius:14px;padding:16px;display:grid;gap:12px}
.compare-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.compare-h b{font-size:15px}
.save{font-weight:700;color:var(--good)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.bar .t{grid-column:1/-1;height:12px;border-radius:6px}
.bar .f{height:100%;border-radius:6px;background:#4A4258;transition:width .6s ease}
.bar.us .f{background:var(--grad)}
.bar.us .lb{font-weight:700}
.extras{font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px}
.fine{font-size:11.5px;color:var(--faint);margin:0}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.alt{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;cursor:pointer}
.alt:hover{border-color:var(--violet)}
.alt .th{width:64px;height:48px;border-radius:8px;overflow:hidden}
.alt .th svg{width:100%;height:100%;display:block}
.alt b{display:block;font-size:13.5px}
.alt small{color:var(--muted);font-size:12px}

/* send */
.msg{width:100%;min-height:230px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:13.5px;line-height:1.5;resize:vertical}
.msg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ctas{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:14px}
@media (max-width:560px){.ctas{grid-template-columns:1fr 1fr 1fr}.ctas .wa{grid-column:1/-1}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:14px 10px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);font-size:15px}
.btn svg{width:18px;height:18px;flex:none}
.status{font-size:13px;min-height:1.4em;margin:10px 0 0;color:var(--pink)}
.next{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:n}
@media (max-width:600px){.next{grid-template-columns:1fr}}
.next li{counter-increment:n;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.next li b{color:var(--ink);display:block}
.next li::before{content:counter(n);font-family:var(--display);font-size:26px;display:block;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.contact{font-size:12.5px;color:var(--faint);margin:14px 0 0}

/* live match panel, shortlist, compare */
.layout{display:grid;gap:28px;align-items:start}
.col{min-width:0}
@media (min-width:1000px){body.has-live .wrap{max-width:1120px}body.has-live .layout{grid-template-columns:minmax(0,1fr) 300px}}
.live{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
@media (min-width:1000px){.live{position:sticky;top:16px}.peek-l{display:none}.live-head{cursor:default}}
@media (max-width:999px){
  .live{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:16px 16px 0 0;border-bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.5);max-height:75vh;overflow:auto}
  .live:not(.open) .live-body{display:none}
  body.has-live{padding-block-end:110px}
}
.live-head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.live-n{font-size:13px;color:var(--muted)}
.live-n b{font-family:var(--display);font-size:30px;font-weight:500;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.live-t{grid-column:1/-1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.live-t i{display:block;height:100%;background:var(--grad);transition:width .45s ease}
.peek-l{grid-column:2;grid-row:1/3;align-self:center;font-size:13px;font-weight:700;color:var(--pink)}
.live-body{display:grid;gap:8px;margin-top:12px}
.live-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer}
.live-row:hover{border-color:var(--violet)}
.live-row .th,.row-main .th{border-radius:7px;overflow:hidden;display:block}
.live-row .th{width:48px;height:36px}
.live-row .th svg,.row-main .th svg{width:100%;height:100%;display:block}
.live-row b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-row small{color:var(--muted);font-size:12px}
.pct{font-size:12px;font-weight:700;color:var(--pink)}
.live-tip{margin:4px 0 0;font-size:13px;line-height:1.45;background:rgba(122,63,224,.16);border:1px solid rgba(122,63,224,.35);border-radius:10px;padding:10px 12px}
.opt .n{font-style:normal;font-size:11.5px;font-weight:600;color:var(--pink);margin-top:4px}
.cnt{font-size:11px;opacity:.7;margin-left:3px;font-family:var(--mono)}
.sortbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.why b{display:block;font-size:14px;margin-bottom:6px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.heart{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.heart:hover{border-color:var(--violet)}
.heart[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.rows{display:grid;gap:10px;margin-top:10px}
.row{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;gap:10px}
.row.dim{opacity:.62}
.row-main{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:0;cursor:pointer;width:100%}
.row-main .th{width:72px;height:54px}
.row-main b{display:block;font-size:15px}
.row-main small{display:block;color:var(--muted);font-size:12.5px}
.row-main small.r1{color:var(--ink);margin-top:2px}
.dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(17,14,24,.94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 12px;z-index:5;font-size:13px;color:var(--muted)}
.dock b{color:var(--ink)}
.dock .cta{padding:11px 18px;font-size:14px}
.cmp{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cmp table{border-collapse:collapse;width:100%;min-width:440px;font-size:13px}
.cmp th,.cmp td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{border-top:0;font-family:var(--display);font-size:17px;font-weight:600}
.cmp tbody th{color:var(--muted);font-weight:500;white-space:nowrap}
.cmp td{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.price{text-align:left}}
</style>

<div class="wrap">

/* ============ MARKET + MATCHING ============ */
function market(p){ const f=areaOf(p.area)?.f ?? 1;
  return p.mode==="rent" ? RENT_BASE[Math.min(6,Math.max(1,p.beds))]*TYPE_RENT[p.type]*f : SQM_BASE[p.type]*f*p.sqm; }
function calc(p){ const m=market(p);
  if (p.mode==="rent"){ const diff=m-p.price; return {m,diff,pct:Math.round(100*diff/m),lease:diff*S.lease}; }
  return {m,diff:m-p.price,pct:Math.round(100*(m-p.price)/m),yield:p.rent*12/p.price,sqmP:p.price/p.sqm,sqmM:m/p.sqm}; }
function score(p){
  let s=0,max=0;
  max+=30; if (!S.area||S.area==="any") s+=22; else if (p.area===S.area) s+=30; else s+=6;
  max+=15; if (S.type==="any"||p.type===S.type) s+=15;
  max+=20; if (p.beds===S.beds) s+=20; else if (p.beds===S.beds+1) s+=12; else if (p.beds>S.beds) s+=4; else s-=25;
  max+=20; const b=budget(); if (p.price<=b) s+=20; else if (p.price<=b*1.12) s+=8; else s-=20;
  if (S.mode==="buy"&&S.own==="freehold"){ max+=10; if (/freehold/i.test(p.own)) s+=10; }
  if (S.mode==="buy"&&S.who==="invest"){ max+=10; if (calc(p).yield>=CONFIG.avgYield) s+=10; }
  S.must.forEach(m=>{ max+=7; if (p.am.includes(m)) s+=7; });
  return Math.max(5,Math.min(99,Math.round(100*s/max)));
}
const ranked = () => LISTINGS.filter(p=>p.mode===(S.mode||"rent")).map(p=>({p,s:score(p)})).sort((a,b)=>b.s-a.s);

/* ============ LIVE MATCH ENGINE ============ */
/* Hard filters only use answers the guest has given; o overrides one answer to preview "what if" counts */
function fitsWith(p,o={}){
  if (p.mode!==(S.mode||"rent")) return false;
  const area = "area" in o ? o.area : (S.done.has("area") ? S.area : null);
  const type = "type" in o ? o.type : (S.done.has("property") ? S.type : "any");
  const beds = "beds" in o ? o.beds : (S.done.has("property") ? S.beds : 0);
  const b = "b" in o ? o.b : (S.done.has("budget") ? budget() : Infinity);
  if (area && area!=="any" && p.area!==area) return false;
  if (type!=="any" && p.type!==type) return false;
  if (p.beds<beds) return false;
  return p.price<=b*1.1;
}
const pool = (o={}) => LISTINGS.filter(p=>fitsWith(p,o));
const nTag = c => `<em class="n">${c===0?"no matches":c+(c===1?" match":" matches")}</em>`;
const total = () => LISTINGS.filter(p=>p.mode===(S.mode||"rent")).length;
/* one smart, data-driven nudge for the live panel */
function insight(){
  const now=pool(), rent=S.mode!=="buy";
  if (!now.length){
    const relaxArea = S.done.has("area")&&S.area!=="any" ? pool({area:"any"}).length : 0;
    if (relaxArea) return `Nothing in ${S.area} fits every answer yet. ${relaxArea} home${relaxArea>1?"s fit":" fits"} elsewhere: try “Not sure” on area.`;
    const cheapest = LISTINGS.filter(p=>fitsWith(p,{b:Infinity})).sort((a,b)=>a.price-b.price)[0];
    if (cheapest) return `Nothing fits that budget yet. From ${money(cheapest.price)}${rent?"/mo":""} you’d have options.`;
    return "Nothing fits every answer yet. Loosen one answer and I’ll update instantly.";
  }
  if (S.done.has("budget")){
    const over = LISTINGS.filter(p=>fitsWith(p,{b:Infinity}) && !now.includes(p)).sort((a,b)=>a.price-b.price)[0];
    if (over){ const extra=over.price-budget(); const opens=pool({b:over.price/1.1+1}).length-now.length;
      if (extra>0 && opens>0 && extra < budget()*0.35) return `Add ${money(Math.ceil(extra/1000)*1000)}${rent?"/mo":""} and ${opens} more home${opens>1?"s":""} open up, including ${over.name}.`; }
  }
  if (!S.done.has("area")){
    const best=ranked().filter(x=>now.includes(x.p)).slice(0,4), by={};
    best.forEach(x=>by[x.p.area]=(by[x.p.area]||0)+x.s);
    const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
    if (top) return `Your strongest matches so far are in ${top[0]}${recArea()&&recArea()!==top[0]?`, with ${recArea()} close behind`:""}.`;
  }
  if (S.must.size){
    const all=now.filter(p=>[...S.must].every(m=>p.am.includes(m))).length;
    if (all) return `${all} of these tick every must-have on your list.`;
    const best=now.map(p=>[p,[...S.must].filter(m=>p.am.includes(m)).length]).sort((a,b)=>b[1]-a[1])[0];
    return `None tick every must-have yet. ${best[0].name} has ${best[1]} of ${S.must.size}.`;
  }
  const v=now.map(p=>[p,calc(p).diff]).sort((a,b)=>b[1]-a[1])[0];
  if (v && v[1]>0) return `Best value so far: ${v[0].name}, ${money(v[1])} below the ${v[0].area} average.`;
  return `${now.length} homes fit so far. Each answer sharpens the list.`;
}
/* why a home suits this guest, in their own terms */
function reasons(p){
  const r=[], miss=[], c=calc(p), v=vibeOf(), rent=p.mode==="rent";
  if (S.area&&S.area!=="any"&&p.area===S.area) r.push(`In ${p.area}, the area you picked`);
  else if (recArea()===p.area) r.push(`In ${p.area}, our pick for ${whoLabel().toLowerCase()||"you"}`);
  if (v && v[2].length && v[2].every(m=>p.am.includes(m))) r.push(`Fits your style: ${v[1].toLowerCase()}`);
  const hit=[...S.must].filter(m=>p.am.includes(m)); if (hit.length) r.push(`Has ${listify(hit.map(k=>AMEN[k].toLowerCase()))}`);
  if (p.price<=budget()) r.push(budget()-p.price>0?`${money(budget()-p.price)}${rent?"/mo":""} under your budget`:"Right on your budget");
  if (c.diff>0) r.push(`${money(c.diff)}${rent?"/mo":""} below the ${p.area} average`);
  if (p.beds>S.beds) r.push(`A spare bedroom (${p.beds} in total)`);
  if (!rent && c.yield>=CONFIG.avgYield) r.push(`${(c.yield*100).toFixed(1)}% estimated yield, above typical`);
  [...S.must].filter(m=>!p.am.includes(m)).forEach(m=>miss.push(AMEN[m].toLowerCase()));
  if (p.price>budget()) miss.push(`${money(p.price-budget())}${rent?"/mo":""} over budget`);
  return {r,miss};
}
function sorted(){
  const list=ranked(), inPool=new Set(pool().map(p=>p.id));

}

/* ============ PERSONA LOGIC ============ */
function applyPersona(k){
  const p=PERSONAS[k]; if (!p) return;
  S.who=k; S.vibe=null; S.people=null;
  Object.assign(S,{type:p.def.type,beds:p.def.beds,lease:p.def.lease}); S.budget.rent=p.def.budget;
  S.must=new Set(p.def.must);
}
function applyVibe(v){
  const p=P(); const row=p.vibes.find(x=>x[0]===v); if (!row) return;
  S.vibe=v; row[2].forEach(m=>S.must.add(m));
  if (S.who==="friends"){ S.people=row[4]; S.beds=Math.min(6,row[4]); S.type="villa"; S.budget.rent=Math.max(S.budget.rent,22000*row[4]); }
  if (S.who==="solo"&&v==="value"){ S.type="condo"; S.budget.rent=Math.min(S.budget.rent,18000); }
  if (S.who==="business"){ if (v==="project") S.lease=6; if (v==="exec"){ S.type="villa"; S.beds=3; S.budget.rent=120000; } if (v==="relocate"){ S.lease=12; } }
  if (S.who==="family"&&v==="little") S.must.delete("school");
}

function articulate(){

    const style = v && VIBE_PHRASE[S.who+"."+S.vibe] ? " "+VIBE_PHRASE[S.who+"."+S.vibe] : "";
    bits.push(`You’re ${who}${style}, looking for a ${typ} ${where}`);

    if (S.who==="business"&&!S.must.has("invoice")) add("invoice","Company lease & tax invoice","so your employer can pay directly",()=>S.must.add("invoice"));
    if (S.who==="business"&&!S.must.has("cleaning")) add("cleaning","Weekly cleaning","come home to a reset space",()=>S.must.add("cleaning"));
    if (S.who==="family"&&!S.must.has("school")&&S.vibe!=="little") add("school","Near schools","shorter school runs",()=>S.must.add("school"));
    if (S.who==="family"&&!S.must.has("pets")) add("pets","Pet friendly","bring the whole family",()=>S.must.add("pets"));
    if (S.who==="retire"&&!S.must.has("commute")) add("commute","Close to hospitals","Bangkok Hospital Phuket within 20 min",()=>S.must.add("commute"));
    if (S.who==="friends"&&S.people&&S.beds<S.people) add("beds",`${S.people} bedrooms`,"a room each",()=>{S.beds=S.people;});
    if (S.lease===6) add("lease12","Make it 12 months","usually 5–10% lower monthly rent",()=>{S.lease=12;});
  } else {
    if (S.who==="invest"&&S.type!=="condo") add("condo","Consider freehold condos","simpler ownership, strong yields",()=>{S.type="condo";S.own="freehold";});
    if (S.who==="home"&&!S.must.has("school")) add("school","Near schools","if kids are coming",()=>S.must.add("school"));
  }
  return out.slice(0,4);
}

const WN={one:1,two:2,three:3,four:4,five:5,six:6};
const n = x => WN[x] ?? parseFloat(x);
function parseAsk(txt){
  const t=" "+txt.toLowerCase().replace(/,/g,"")+" ", got=[]; let m;
  if (/\b(buy|buying|purchase|invest|investment|for sale|freehold|leasehold)\b/.test(t)) { S.mode="buy"; got.push("Buy"); }
  else if (/\b(rent|rental|renting|lease|monthly|per month|a month|months|long.?term|nomad|remote|relocat)\b/.test(t) || !/\bbuy/.test(t)) { S.mode="rent"; }
  S.done.add("mode");
  if (S.mode==="rent"){
    const who=[["business",/business|company|corporate|relocat|secondment|staff|employee|work permit|expat assignment/],["nomad",/nomad|remote|freelanc|laptop|work online/],
      ["family",/family|kids|children|school|baby/],["friends",/friends|sharing|share|flatmates|housemates/],["retire",/retire|retirement|pension/],
      ["couple",/couple|partner|wife|husband|girlfriend|boyfriend|honeymoon/],["solo",/\bsolo\b|alone|myself|just me|single|on my own/]];
    for (const [k,re] of who){ if (re.test(t)){ applyPersona(k); S.done.add("who"); got.push(PERSONAS[k].l); break; } }
  } else {
    const bw=[["invest",/invest|yield|rental income|roi/],["holiday",/holiday home|second home|vacation/],["home",/live|residence|move/]];
    for (const [k,re] of bw){ if (re.test(t)){ S.who=k; S.done.add("who"); got.push(BUYERS.find(b=>b.k===k).l); break; } }
  }
  AREAS.forEach(a=>{ if (t.includes(a.k.toLowerCase()) || (a.k==="Bang Tao"&&/bangtao|laguna/.test(t)) || (a.k==="Phuket Town"&&/old town|town centre|city/.test(t))) { S.area=a.k; S.done.add("area"); got.push(a.k); } });
  if (/condo|apartment|flat|studio/.test(t)) { S.type="condo"; got.push("Condo"); } else if (/townhouse|town house/.test(t)) { S.type="townhouse"; got.push("Townhouse"); } else if (/villa|house/.test(t)) { S.type="villa"; got.push("Villa"); }
  if (/studio/.test(t)) S.beds=1;
  if ((m=t.match(/(\d+|one|two|three|four|five|six)\s*-?\s*(bed|bedroom|br|bdr)/))) { S.beds=Math.min(6,Math.max(1,n(m[1]))); S.done.add("property"); got.push(S.beds+" bed"); }
  if ((m=t.match(/(\d+|two|three|four|five|six)\s*(of us|people|friends|adults)/)) && S.who==="friends") { S.people=Math.min(6,n(m[1])); S.beds=Math.max(S.beds,S.people); S.vibe=String(Math.min(5,S.people)); }
  if (/freehold/.test(t)) { S.own="freehold"; got.push("Freehold"); }
  if ((m=t.match(/(1|3|6|12|24|one|three|six|twelve)\s*months?/))) { S.lease=({one:1,three:3,six:6,twelve:12}[m[1]]||+m[1]); got.push(S.lease+"-month stay"); }
  else if (/1 year|one year|a year/.test(t)) { S.lease=12; got.push("12 months"); } else if (/2 years|two years/.test(t)) { S.lease=24; got.push("24 months"); }
  if (/asap|right away|urgent|immediately/.test(t)) { S.timeline="now"; S.moveIn=0; got.push("ASAP"); }
  if ((m=t.match(/(?:฿|thb\s*)?(\d+(?:\.\d+)?)\s*(k|m|million)?\s*(?:thb|baht|฿)?\s*(?:a|per|\/)\s*month/)) || (S.mode==="rent"&&(m=t.match(/(?:under|below|max|budget|up to)\s*(?:฿)?(\d+(?:\.\d+)?)\s*(k)\b/)))) {
    const v=n(m[1])*(m[2]==="k"?1e3:m[2]?1e6:1); if (v>=5000&&v<=1e6){ S.budget.rent=Math.round(v/1000)*1000; S.done.add("budget"); got.push("≤ "+thb(S.budget.rent)+"/mo"); } }
  else if ((m=t.match(/(?:฿|thb\s*)?(\d+(?:\.\d+)?)\s*(m|million|mil)\b/))) { const v=n(m[1])*1e6; S.budget.buy=v; S.mode="buy"; S.done.add("budget"); got.push("≤ "+big(v)); }
  else if ((m=t.match(/\$\s?(\d+(?:\.\d+)?)\s*(k|m)?/))) { const v=n(m[1])*(m[2]==="k"?1e3:m[2]==="m"?1e6:1)*33; if (S.mode==="buy") S.budget.buy=v; else S.budget.rent=v; S.done.add("budget"); got.push("≤ "+big(v)); }
  [["pool",/pool/],["seaview",/sea ?view|ocean view/],["beach",/beach/],["school",/school/],["furnished",/furnished/],["pets",/\bpets?\b|\bdogs?\b|\bcats?\b|pet.friendly/],["gym",/gym|fitness|muay thai|training/],
   ["workspace",/desk|office|workspace/],["fibre",/wifi|wi-fi|internet|fibre|fiber/],["cowork",/cowork|co-work|cafes|cafés/],["quiet",/quiet|private|peace|secluded/],
   ["amenities",/shops|walkable|restaurants|nightlife|social/],["cleaning",/clean|housekeep|maid/],["invoice",/invoice|company lease|\btax\b/],["commute",/airport|commute|hospital/]]
    .forEach(([k,re])=>{ if (re.test(t)){ S.must.add(k); got.push(AMEN[k]); } });
  return [...new Set(got)];
}

/* ============ CONCIERGE LINES (rapport) ============ */
function line(step){
  const p=P(), v=vibeOf(), a=S.area&&S.area!=="any"&&areaOf(S.area), rent=S.mode!=="buy";
  switch(step){
    case "mode": return `${S.name?`Lovely to meet you, ${esc(S.name)}. `:"Hi, I’m your Elevare concierge. "}A few quick taps and I’ll find a place that fits you, then show how its price compares with the market.`;
    case "who": return rent ? `${hi()}tell me a little about you. Every renter needs something different, so I’ll tailor the questions.` : `${hi()}buying in Phuket, exciting. What’s the property for?`;
    case "vibe": return {nomad:"Remote work, nice. Fast fibre and a proper desk are already on my list.",couple:"A place for two. I’ve started with a private pool, you can change that later.",
      solo:"Your own place, your rules. Condos with a pool and gym usually give solo renters the best value.",business:"Here for work. I’ll look for furnished homes that can be leased in a company name with a tax invoice.",
      family:"Family first. I’ve added a pool and schools nearby as a starting point.",retire:"Welcome. Most of our retirees value calm, good healthcare and an easy routine.",
      friends:"Sharing is the smartest way to live well here. A big villa split four ways often costs less than four condos."}[S.who]||"";
    case "area": return v ? `“${esc(v[1])}”, got it. That points to <em>${recArea()}</em>, but here’s the full map.` : S.who&&!rent ? `For ${whoLabel().toLowerCase()} buyers, <em>${recArea()}</em> is a strong start.` : "Where would you like to be?";
    case "property": return a ? `<em>${a.k}</em>: ${a.d.toLowerCase()}. ${p?`For ${p.l.toLowerCase()} renters I’d suggest a ${TYPES[p.def.type].toLowerCase()}, already selected.`:"What kind of property?"}` : "I’ll recommend the area. What kind of property?";
    case "timing": return rent ? `A ${S.beds}-bedroom ${TYPES[S.type]?.toLowerCase()||"home"}. When do you want the keys?` : `A ${S.beds}-bedroom ${TYPES[S.type]?.toLowerCase()||"property"}. What’s your timeline?`;
    case "budget": return rent ? `${S.moveIn===0?"As soon as possible":monthName(moveInDate())}, ${S.lease} month${S.lease>1?"s":""}. ${S.lease>=12?"Twelve months usually earns the best rate.":S.lease<=3?"Shorter stays are fine, rates are a little higher.":""} What monthly rent feels right?` : `${TIMELINES[S.timeline]}. What’s your purchase budget?`;
    case "must": return `Up to ${money(budget())}${rent?" a month":""}. I’ve pre-selected what ${p?p.l.toLowerCase()+" renters":"buyers like you"} usually ask for. Add or remove anything.`;
    case "confirm": return `${hi()}here’s what I heard. Check it’s right, or tap a suggestion to sharpen it.`;
    case "match": { const fitN=pool().length, top=ranked()[0]?.p, below=top&&calc(top).diff>0;
      if (!fitN) return `${hi()}nothing ticks every box yet, so here are the closest. ${esc(insight())}`;
      return `${hi()}${fitN===1?"one home fits":fitN+" homes fit"} your brief. Here’s the strongest${below?`, priced ${money(calc(top).diff)} below the ${top.area} average`:""}. Save the ones you like and we’ll show you them in one trip.`; }
    case "book": return "Want to see it before you commit? Pick how, and I’ll write the message for you.";
    case "send": return "Your message is ready. Tap WhatsApp and it opens with everything filled in.";
  }
  return "";
}

CPJvGkyF8YBu0mxo3tLI4OpvU87rDd5nvRXZeLKIsZDauyuq0VDmwCRJC575Zle1+T/AZnK7G9+uOzcAAAAAElFTkSuQmCC" alt="Elevare Property Partners">
      <div class="eyebrow">Phuket property concierge · Rentals &amp; sales</div>
      <h1>Find your place in Phuket, <span class="grad-text">matched in 60 seconds.</span></h1>
      <p>Nomad, couple, solo, family, business or buying: answer a few quick taps and we’ll match you, compare the price with the market, and write your WhatsApp message.</p>
      <div class="box" style="max-width:360px"><label for="nameIn">First, what should we call you? (optional)</label><input type="text" id="nameIn" value="${esc(S.name)}" autocomplete="given-name" placeholder="Your first name"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="cta" data-mode="rent" type="button">I want to rent →</button><button class="cta" data-mode="buy" type="button" style="background:var(--surface-2);box-shadow:none;border:1px solid var(--line)">I want to buy →</button></div>
      <button class="ghost" data-browse="rent" type="button" style="justify-self:start">Just browse every rental</button>
    </section>
    <div class="or">or just tell us</div>
    <div class="ask">
      <label for="askText" class="eyebrow">Describe what you need</label>
      <textarea id="askText" rows="2" autocomplete="off" spellcheck="false" aria-controls="suggest" placeholder="e.g. Digital nomad, 1 bed near coworking in Rawai, 3 months"></textarea>
      <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      <p class="hint" id="heard" style="margin:6px 0 8px;font-size:13px;color:var(--muted)"></p>
      <div class="ask-row"><div class="understood" id="understood"></div><button class="cta" id="askGo" type="button" style="padding:9px 18px;font-size:13px">Match me →</button></div>
    </div>
    <div class="ideas" id="ideas"></div>
    <div class="proof">
      <div><b>Priced against the market</b>See how each home compares with similar local listings.</div>
      <div><b>See it first</b>In-person or live video viewing, arranged on WhatsApp.</div>
      <div><b>One local contact</b>The same Elevare advisor from first message to keys.</div>
    </div>`;
  },
  mode(){ return `<section class="screen">${say("mode")}<h2 class="q">Are you looking to rent or buy?</h2><p class="qsub">Rentals run from 1 month to multi-year leases.</p>
    <div class="opts">${opt("mode","rent",S.mode==="rent","Rent","Monthly, 3, 6, 12 or 24-month stays")}${opt("mode","buy",S.mode==="buy","Buy","Villas, condos and townhouses, freehold or leasehold")}</div></section>`; },
  who(){
    if (S.mode==="buy") return `<section class="screen">${say("who")}<h2 class="q">What’s it for?</h2><p class="qsub">This helps us suggest the right area and property.</p>
      <div class="opts">${BUYERS.map(b=>opt("who",b.k,S.who===b.k,b.l,b.d)).join("")}</div></section>`;
    return `<section class="screen">${say("who")}<h2 class="q">Which sounds most like you?</h2><p class="qsub">Pick the closest. You can fine-tune everything later.</p>
      <div class="opts">${Object.entries(PERSONAS).map(([k,p])=>opt("who",k,S.who===k,p.l,p.d)).join("")}</div></section>`; },
  vibe(){ const p=P(); if (!p) return SCREENS.who();
    return `<section class="screen">${say("vibe")}<h2 class="q">${p.q}</h2><p class="qsub">This steers the area and the must-haves I suggest.</p>
      <div class="opts">${p.vibes.map(v=>opt("vibe",v[0],S.vibe===v[0],v[1],v[2].length?"Adds: "+v[2].map(k=>AMEN[k].toLowerCase()).join(", "):`Best area: ${v[3]}`)).join("")}</div></section>`; },
  area(){ const rec=recArea();
    const sorted=[...AREAS].sort((a,b)=>((b.k===rec)-(a.k===rec)) || (pool({area:b.k}).length-pool({area:a.k}).length));
    return `<section class="screen">${say("area")}<h2 class="q">Which part of Phuket?</h2><p class="qsub">Tap one. Not sure? Let us pick.</p>
    <div class="opts">${sorted.map(a=>`<button type="button" class="opt" data-area="${a.k}" aria-pressed="${S.area===a.k}"><b>${a.k}${a.k===rec?` <span class="grad-text" style="font-size:11px;font-weight:700">· SUGGESTED FOR YOU</span>`:""}</b><span>${a.d}</span>${nTag(pool({area:a.k}).length)}</button>`).join("")}
    ${opt("area","any",S.area==="any","Not sure yet","Show me the best match anywhere on the island","wide")}</div><div class="actions">${skip()}<span></span></div></section>`; },
  property(){ return `<section class="screen">${say("property")}<h2 class="q">What kind of place?</h2><p class="qsub">Choose a type and how many bedrooms you need.</p>
    <div class="chips">${[...Object.entries(TYPES),["any","Open to any"]].map(([k,l])=>chip("type",k,S.type===k,`${l} <small class="cnt">${pool({type:k,beds:S.beds}).length}</small>`)).join("")}</div>
    <div class="pair" style="margin-top:12px">
      <div class="box"><span class="l">Bedrooms</span><div class="stepper"><button type="button" data-step="beds" data-d="-1" aria-label="Fewer bedrooms">−</button><output style="font-family:var(--display)">${S.beds}</output><button type="button" data-step="beds" data-d="1" aria-label="More bedrooms">+</button></div><span class="hint">${pool({type:S.type,beds:S.beds}).length} ${S.type==="any"?"homes":TYPES[S.type].toLowerCase()+"s"} with ${S.beds}+ bedrooms fit so far</span></div>
      ${S.mode==="buy"?`<div class="box"><span class="l">Ownership</span><div class="chips">${chip("own","any",S.own==="any","Either")}${chip("own","freehold",S.own==="freehold","Foreign freehold")}${chip("own","leasehold",S.own==="leasehold","Leasehold is fine")}</div><span class="hint">Foreigners can own condos freehold; villas are usually leasehold.</span></div>`:""}
    </div>${next()}</section>`; },
  timing(){
    if (S.mode==="buy") return `<section class="screen">${say("timing")}<h2 class="q">What’s your timeline?</h2><p class="qsub">No pressure. It helps us prioritise viewings.</p>
      <div class="opts">${Object.entries(TIMELINES).map(([k,l])=>opt("timeline",k,S.timeline===k,l,{now:"Funds ready, want to move quickly",["3m"]:"Actively viewing properties",["6m"]:"Planning ahead",research:"Comparing options for now"}[k])).join("")}</div></section>`;
    return `<section class="screen">${say("timing")}<h2 class="q">When do you want the keys?</h2><p class="qsub">We confirm exact availability on WhatsApp.</p>
      <div class="pair">
        <div class="box"><span class="l">Move-in</span><div class="chips">${[0,1,2,3,4,5].map(k=>chip("movein",k,S.moveIn===k,k===0?"ASAP":monthsAhead(k).toLocaleDateString("en-GB",{month:"short",year:"2-digit"}))).join("")}</div></div>
        <div class="box"><span class="l">How long?</span><div class="chips">${[1,3,6,12,24].map(k=>chip("lease",k,S.lease===k,k===1?"1 month":k+" months")).join("")}</div><span class="hint">Longer stays usually get better monthly rates.</span></div>
      </div>${next()}</section>`; },
  budget(){ const rent=S.mode!=="buy";
    const tiers = rent ? [[20000,"Up to ฿20k / month","Studios and 1-bed condos"],[40000,"฿20k – 40k / month","Larger condos, townhouses"],[80000,"฿40k – 80k / month","Pool villas"],[150000,"฿80k+ / month","Large and sea-view villas"]]
                       : [[8000000,"Up to ฿8M","Condos and townhouses"],[15000000,"฿8M – 15M","Pool villas, larger condos"],[30000000,"฿15M – 30M","Sea-view and family villas"],[60000000,"฿30M+","Prestige estates"]];
    const [min,max,step] = rent ? [8000,300000,1000] : [3000000,80000000,500000];
    return `<section class="screen">${say("budget")}<h2 class="q">${rent?"Monthly budget?":"Purchase budget?"}</h2><p class="qsub">${S.who&&rent?`We’ve pre-set a typical ${PERSONAS[S.who].l.toLowerCase()} budget. Adjust freely.`:"We’ll show you how your match compares with the market either way."}</p>
    <div class="opts">${tiers.map(([v,l,d])=>`<button type="button" class="opt" data-budget="${v}" aria-pressed="${budget()===v}"><b>${l}</b><span>${d}</span>${nTag(pool({b:v}).length)}</button>`).join("")}</div>
    <div class="box" style="margin-top:12px"><label for="budget">Or set it exactly</label><div class="bigval num" id="budgetVal" style="font-size:28px">${money(budget())}${rent?" / month":""}</div><span class="hint" id="budgetFit">${pool({b:budget()}).length} homes fit at this budget</span>
      <input type="range" id="budget" min="${min}" max="${max}" step="${step}" value="${budget()}"></div>${next()}</section>`; },
  must(){ const order = P()?.show || Object.keys(AMEN), rest=Object.keys(AMEN).filter(k=>!order.includes(k));
    return `<section class="screen">${say("must")}<h2 class="q">Your must-haves</h2><p class="qsub">The most relevant ones for you are first.</p>
    ${P()?`<p class="hint" style="margin:-10px 0 12px">Numbers show how many of your ${pool().length} current matches have each one.</p>`:""}
    <div class="chips">${order.map(k=>chip("must",k,S.must.has(k),`${AMEN[k]} <small class="cnt">${pool().filter(p=>p.am.includes(k)).length}</small>`)).join("")}</div>
    <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">More options</summary><div class="chips" style="margin-top:10px">${rest.map(k=>chip("must",k,S.must.has(k),AMEN[k])).join("")}</div></details>
    ${next("Review my brief")}</section>`; },
  confirm(){ const refs=refinements();
    return `<section class="screen">${say("confirm")}<h2 class="q">Did I get that right?</h2>
    <div class="box" style="border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:1px solid transparent">
      <p id="playback" style="margin:0;font-family:var(--display);font-size:22px;line-height:1.3">${articulate()}</p></div>
    ${refs.length?`<div class="eyebrow" style="margin-top:18px">Suggestions to sharpen your search</div>
      <div class="opts" style="margin-top:8px">${refs.map(r=>`<button type="button" class="opt" data-ref="${r.id}"><b>+ ${esc(r.label)}</b><span>${esc(r.why)}</span></button>`).join("")}</div>`:""}
    <div class="ask" style="margin-top:14px"><label for="noteIn" class="eyebrow">Anything else we should know?</label>
      <textarea id="noteIn" rows="2" placeholder="e.g. we have a small dog, need parking for two cars">${esc(S.note)}</textarea>
      <ul class="suggest" id="suggest" role="listbox" hidden></ul></div>

/* ============ HELPERS ============ */
function compareTable(){
  const hs=[...S.cmp].map(id=>LISTINGS.find(p=>p.id===id)).filter(Boolean), rent=S.mode!=="buy";
  const rows=[["Price",p=>money(p.price)+(rent?"/mo":"")],["vs. area average",p=>{const c=calc(p);return c.diff>0?`${money(c.diff)} below`:"at market";}],
    ["Area",p=>p.area],["Type",p=>`${p.beds}-bed ${TYPES[p.type].toLowerCase()}`],["Size",p=>p.sqm+" m²"],
    ["Your must-haves",p=>`${[...S.must].filter(m=>p.am.includes(m)).length} of ${S.must.size}`],["Match",p=>score(p)+"%"],
    ...(rent?[["Included",p=>p.ex.join(", ")]]:[["Ownership",p=>p.own],["Est. yield",p=>(calc(p).yield*100).toFixed(1)+"%"]])];
  return `<div class="cmp"><div class="compare-h" style="margin-bottom:8px"><b>Side by side</b><button class="ghost" data-cmpclear="1" type="button">Clear</button></div>
    <div style="overflow-x:auto"><table><thead><tr><th></th>${hs.map(p=>`<th>${p.name}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([l,f])=>`<tr><th>${l}</th>${hs.map(p=>`<td>${esc(f(p))}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}
const homes = () => { const s=[...S.saved].map(id=>LISTINGS.find(p=>p.id===id)).filter(Boolean); return s.length?s:[pick()]; };
const pick = () => LISTINGS.find(p=>p.id===S.pick) || ranked()[0].p;
function refCode(){ const hs=homes(), p=hs[0], w=(S.who||"x").slice(0,3).toUpperCase(), ids=hs.map(h=>h.id).join("+"); return p.mode==="rent" ? `ELV-R-${w}-${ids}-${S.lease}M` : `ELV-S-${w}-${ids}`; }
function buildMessage(){
  const hs=homes(), p=hs[0], rent=p.mode==="rent", tour=hs.length>1, names=tour?`these ${hs.length} homes`:p.name;
  const day=addDays(today,S.day).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  const ask = S.view==="viewing" ? `I'd like to view ${names} in person on ${day}, ${S.time.toLowerCase()}${tour?", one after another if possible":""}.`
            : S.view==="video" ? `I'd like a live video walkthrough of ${names} on ${day}, ${S.time.toLowerCase()}.`
            : S.view==="hold" ? `Please reserve ${tour?"my favourite of "+names:p.name} while you confirm availability and lease terms.`
            : `Please send me the full details for ${names}: floor plan, title documents and buying costs.`;
  const quote = hs.map(h=>{ const c=calc(h); return rent ? `• ${h.name}, ${h.area}: ${thb(h.price)} per month (${S.lease} month${S.lease>1?"s":""})`
    : `• ${h.name}, ${h.area}: ${big(h.price)} asking, ${h.sqm} m², ${h.own.toLowerCase()}, est. yield ${(c.yield*100).toFixed(1)}%`; }).join("\n");
  return `Hi ${CONFIG.brand}${S.name?`, this is ${S.name}`:""} 👋

${ask}

About me
${articulate().replace(/^You’re/,"I’m").replace("You also mentioned","Also").replace("suits you best","suits me best").replace(/^I’m a couple who love/,"We’re a couple who love").replace(/^I’m a couple/,"We’re a couple").replace(/^I’m (a family|\d+ friends|friends)/,"We’re $1")}

${tour?"The homes":"The property"}
${quote}
• Ref: ${refCode()}

Could you confirm availability and the next step? Thank you!`;
}
function statusText(ch){ return ch==="copy" ? "Copied. Paste it into WhatsApp, a text or an email to us."

function lead(channel){
  const hs=homes(), p=hs[0], c=calc(p);
  const payload={event:"elevare_lead",channel,ref:refCode(),mode:p.mode,persona:S.who,style:S.vibe,summary:articulate(),note:S.note,listing:p.name,listing_id:p.id,
    listings:hs.map(h=>({id:h.id,name:h.name,price_thb:h.price})),compared:[...S.cmp],
    price_thb:p.price,market_thb:Math.round(c.m),area:S.area,type:S.type,beds:S.beds,ownership:S.own,move_in:p.mode==="rent"?iso(moveInDate()):null,
    lease_months:p.mode==="rent"?S.lease:null,timeline:p.mode==="buy"?S.timeline:null,budget_thb:budget(),must:[...S.must],viewing:S.view,
    day:iso(addDays(today,S.day)),time:S.time,name:S.name,message:$("msg").value,ts:new Date().toISOString()};
  try { (window.dataLayer=window.dataLayer||[]).push(payload); } catch {}

}

/* ============ NAV + RENDER ============ */
function go(step,push=true){
  if (push&&step!==cur) trail.push(cur);
  cur=step; render();
  try { window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); } catch {}
}
const nextOf = step => { const f=flow(); return f[f.indexOf(step)+1]; };
function render(){
  $("stage").innerHTML=SCREENS[cur]();
  $("back").hidden = cur==="welcome"||cur==="matching";
  const q=quiz(), qi=q.indexOf(cur), si=["match","book","send"].indexOf(cur), total=q.length+3;
  $("progress").hidden = cur==="welcome";
  if (cur!=="welcome"){
    const pos = qi>=0 ? qi+1 : cur==="matching" ? q.length : q.length+si+1;
    $("bar").style.width=(100*pos/total)+"%";
    $("stepLabel").textContent = cur==="matching"?"Matching":LABEL[cur];
    $("stepCount").textContent = qi>=0 ? (cur==="confirm"?"Last check":`Question ${qi+1} of ${q.length-1}`) : cur==="matching" ? "" : `Step ${si+1} of 3 to your viewing`;
    if (cur==="match") $("stepCount").textContent = "Save, compare, then book";
  }
  renderBrief(); renderLive();
  if (cur==="welcome") initAsk("askText",true);
  if (cur==="confirm") initAsk("noteIn",false);
  if (cur==="matching") runScan();
  if (cur==="send"){ $("msg").value = S.msgEdited ? (S.msgDraft||buildMessage()) : buildMessage(); links(); }
}
function renderBrief(){
  if (cur==="welcome"||cur==="matching"){ $("brief").innerHTML=""; return; }
  const it=[];
  if (S.done.has("mode")&&S.mode) it.push(["mode",S.mode==="rent"?"Rent":"Buy"]);
  if (S.done.has("who")&&S.who) it.push(["who",whoLabel()]);
  if (S.vibe&&vibeOf()) it.push(["vibe",vibeOf()[1]]);
  if (S.done.has("area")&&S.area) it.push(["area",S.area==="any"?"Anywhere":S.area]);
  if (S.done.has("property")) it.push(["property",`${S.beds} bed · ${S.type==="any"?"any type":TYPES[S.type]}`]);
  if (S.done.has("timing")) it.push(["timing",S.mode==="buy"?TIMELINES[S.timeline]:`${S.moveIn===0?"ASAP":moveInDate().toLocaleDateString("en-GB",{month:"short"})} · ${S.lease} mo`]);
  if (S.done.has("budget")) it.push(["budget","≤ "+money(budget())+(S.mode==="buy"?"":"/mo")]);
  if (S.done.has("must")&&S.must.size) it.push(["must",`${S.must.size} must-have${S.must.size>1?"s":""}`]);
  $("brief").innerHTML=it.map(([k,v])=>`<button type="button" data-go="${k}" title="Change ${LABEL[k].toLowerCase()}"><b>${esc(v)}</b></button>`).join("");
}
function runScan(){
  const lis=[...document.querySelectorAll("#scan li")], fast=matchMedia("(prefers-reduced-motion: reduce)").matches, gap=fast?80:380;
  S.pick=null; lis.forEach((li,i)=>setTimeout(()=>li.classList.add("on"),gap*(i+1)));
  setTimeout(()=>{ if (cur==="matching"){ trail=trail.filter(h=>h!=="matching"); cur="match"; if (trail[trail.length-1]!=="confirm") trail.push("confirm"); render(); } }, gap*(lis.length+1)+200);
}
function autoNext(key){ S.done.add(key); setTimeout(()=>{ if (cur===key) go(nextOf(key)); },280); }

/* free-text boxes with typeahead (welcome request and confirm note) */
let items=[], sel=-1, tmr, activeTa=null;
function initAsk(id,isMain){
  const ta=$(id); if (!ta) return; activeTa=ta;
  if (isMain){ try { const d=localStorage.getItem("elevare_ask3"); if (d&&!ta.value) ta.value=d; } catch {} askUpdate(); }
  ta.addEventListener("input",()=>{ if (isMain){ clearTimeout(tmr); tmr=setTimeout(askUpdate,160); try{localStorage.setItem("elevare_ask3",ta.value);}catch{} } else { S.note=ta.value.trim().slice(0,300); if ($("playback")) $("playback").textContent=articulate(); } showSuggest(); });
  ta.addEventListener("keydown",e=>{
    if ($("suggest").hidden){ if (isMain&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); askGo(); } return; }
    if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length; [...$("suggest").children].forEach((li,i)=>li.setAttribute("aria-selected",i===sel)); }
    else if (e.key==="Tab"||e.key==="Enter"){ e.preventDefault(); accept(sel); }
    else if (e.key==="Escape") hideSuggest();
  });
  ta.addEventListener("blur",()=>setTimeout(hideSuggest,120));
  $("suggest").addEventListener("mousedown",e=>{ const li=e.target.closest("li"); if (li){ e.preventDefault(); accept(+li.dataset.i); } });
}
function askUpdate(){
  const txt=$("askText").value, keep=S; S=fresh(); S.name=keep.name; const got=txt.trim()?parseAsk(txt):[];
  const heard = got.length ? articulate() : ""; const mode=S.mode, who=S.who; S=keep;
  $("understood").innerHTML = got.length ? `<span>Understood:</span>`+got.map(g=>`<span class="tag">${esc(g)}</span>`).join("") : `<span>Type, or tap an example below</span>`;
  $("heard").innerHTML = heard ? `<b style="color:var(--ink)">So:</b> ${esc(heard)}` : "";
  const t=txt.toLowerCase(), ideas=[];
  if (!t.trim()) STARTERS.forEach(s=>ideas.push({s,full:1}));
  else {
    if (mode==="rent"&&!who) ideas.push({s:"digital nomad"},{s:"couple"},{s:"on my own"},{s:"for business"});
    if (who==="nomad"&&!/wifi|fibre|internet/.test(t)) ideas.push({s:"fast wifi"});
    if (who==="nomad"&&!/cowork/.test(t)) ideas.push({s:"near coworking"});
    if (who==="business"&&!/invoice|company lease/.test(t)) ideas.push({s:"company lease with tax invoice"});
    if (who==="family"&&!/school/.test(t)) ideas.push({s:"near schools"});
    if (who==="couple"&&!/pool/.test(t)) ideas.push({s:"private pool"});
    if (!AREAS.some(a=>t.includes(a.k.toLowerCase()))) ideas.push({s:"in "+(who&&PERSONAS[who]?PERSONAS[who].area:"Rawai")});
    if (!/bed|studio/.test(t)) ideas.push({s:who==="family"?"3 bedrooms":"1 bedroom"});
    if (mode!=="buy"&&!/month|year/.test(t)) ideas.push({s:who==="nomad"?"3 months":"12 months"});
    if (!/(under|budget|฿|\$|\dm\b|million|\dk)/.test(t)) ideas.push({s:mode==="buy"?"under 20m":who==="solo"||who==="nomad"?"under 25k a month":"under 80k a month"});
  }
  $("ideas").innerHTML=ideas.slice(0,6).map(i=>`<button type="button" class="chip ${i.full?"":"add"}" data-idea="${esc(i.s)}" data-full="${i.full?1:0}">${esc(i.s)}</button>`).join("");
}
function showSuggest(){
  const ta=activeTa, pre=ta.value.slice(0,ta.selectionStart), last=(pre.match(/(\S+)$/)||["",""])[1].toLowerCase();
  if (last.length<2) return hideSuggest();
  items=VOCAB.filter(x=>x.w.toLowerCase().split(" ").some(p=>p.startsWith(last)) && !pre.toLowerCase().includes(x.w.toLowerCase())).slice(0,6);
  if (!items.length) return hideSuggest();
  sel=0; $("suggest").innerHTML=items.map((x,i)=>`<li role="option" data-i="${i}" aria-selected="${i===0}"><span>${esc(x.w)}</span><small>${x.h}</small></li>`).join(""); $("suggest").hidden=false;
}
function hideSuggest(){ const s=$("suggest"); if (s) s.hidden=true; items=[]; }
function accept(i){
  const ta=activeTa, pos=ta.selectionStart, pre=ta.value.slice(0,pos), post=ta.value.slice(pos), st=pre.search(/(\S+)$/), at=st<0?pos:st;
  ta.value=pre.slice(0,at)+items[i].w+" "+post.replace(/^\S*/,"").trimStart();
  const c=at+items[i].w.length+1; ta.setSelectionRange(c,c); hideSuggest();
  if (ta.id==="askText") askUpdate(); else { S.note=ta.value.trim().slice(0,300); $("playback").textContent=articulate(); }
}
function askGo(){
  const txt=$("askText").value.trim(); if (!txt){ S.mode="rent"; S.done.add("mode"); go("who"); return; }
  const name=S.name; S=fresh(); S.name=name; parseAsk(txt);
  if (!S.must.size && !S.who) S.must.add(S.type==="condo"?"gym":"pool");
  if (S.mode==="rent"&&S.who&&!S.vibe&&S.who!=="friends") S.done.add("vibe");
  const gap=["who","area"].find(k=>!S.done.has(k));
  ["mode","property","timing","budget","must"].forEach(k=>S.done.add(k));
  go(gap||"confirm");
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("button, a"); if (!b) return; const d=b.dataset;
  if (b.id==="home"){ e.preventDefault(); trail=[]; go("welcome",false); return; }
  if (b.id==="back"){ const p=trail.pop(); if (p){ cur=p==="matching"?"confirm":p; render(); } return; }
  if (d.go){ if (d.go==="next"){ S.done.add(cur); if (cur==="confirm") S.pick=null; go(cur==="book"?"send":nextOf(cur)); } else go(d.go); return; }
  if (d.mode){ if (S.mode!==d.mode){ S.who=null; S.vibe=null; S.done.delete("who"); S.done.delete("vibe"); S.pick=null; S.view="viewing"; } S.mode=d.mode;
    if (cur==="welcome"){ S.done.add("mode"); go("who"); } else { render(); autoNext("mode"); } return; }
  if (d.who){ if (S.mode==="buy") S.who=d.who; else if (S.who!==d.who) applyPersona(d.who); render(); autoNext("who"); return; }
  if (d.vibe){ applyVibe(d.vibe); render(); autoNext("vibe"); return; }
  if (d.area){ S.area=d.area; S.pick=null; render(); autoNext("area"); return; }
  if (d.type){ S.type=d.type; S.done.add("property"); render(); return; }
  if (d.own){ S.own=d.own; render(); return; }
  if (d.step){ S.beds=Math.min(6,Math.max(1,S.beds+ +d.d)); S.done.add("property"); render(); return; }
  if (d.timeline){ S.timeline=d.timeline; render(); autoNext("timing"); return; }
  if (d.movein!==undefined){ S.moveIn=+d.movein; render(); return; }
  if (d.lease){ S.lease=+d.lease; render(); return; }
  if (d.budget){ S.budget[S.mode||"rent"]=+d.budget; render(); autoNext("budget"); return; }
  if (d.must){ S.must.has(d.must)?S.must.delete(d.must):S.must.add(d.must); b.setAttribute("aria-pressed",S.must.has(d.must)); renderLive(); return; }
  if (b.id==="peek"){ S.peek=!S.peek; renderLive(); return; }
  if (d.preview){ S.pick=d.preview; S.peek=false; go("match"); return; }
  if (d.jump){ S.pick=null; S.peek=false; go("match"); return; }
  if (d.browse){ const name=S.name; S=fresh(); S.name=name; S.mode=d.browse; S.done.add("mode"); S.must=new Set(); go("match"); return; }
  if (d.skip){ if (cur==="area"){ S.area="any"; S.done.add("area"); } if (cur==="property"){ S.type="any"; S.done.delete("property"); } if (cur==="budget") S.done.delete("budget");
    go(nextOf(cur)); return; }
  if (d.save){ S.saved.has(d.save)?S.saved.delete(d.save):S.saved.add(d.save); const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (d.cmp){ if (S.cmp.has(d.cmp)) S.cmp.delete(d.cmp); else { if (S.cmp.size>=3) S.cmp.delete([...S.cmp][0]); S.cmp.add(d.cmp); } const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  if (d.cmpclear){ S.cmp.clear(); render(); return; }
  if (d.sort){ S.sort=d.sort; S.pick=null; render(); return; }
  if (d.ref){ const r=refinements().find(x=>x.id===d.ref); if (r){ r.fn(); S.pick=null; render(); } return; }
  if (d.pick){ S.pick=d.pick; render(); window.scrollTo({top:0}); return; }
  if (d.view){ S.view=d.view; render(); return; }
  if (d.day){ S.day=+d.day; render(); return; }
  if (d.time){ S.time=d.time; render(); return; }
  if (d.idea!==undefined){ const ta=$("askText"); ta.value=d.full==="1"?d.idea:(ta.value.trim().replace(/[.,]$/,"")+", "+d.idea).replace(/^, /,""); askUpdate(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); return; }
  if (b.id==="askGo"){ askGo(); return; }
  if (b.id==="resetMsg"){ S.msgEdited=false; S.msgDraft=""; render(); return; }
  if (b.id==="restart"){ const name=S.name; S=fresh(); S.name=name; trail=[]; try{localStorage.removeItem("elevare_ask3");}catch{} go("welcome",false); return; }
  if (d.ch){ S.sent=d.ch; lead(d.ch);
    if (d.ch==="copy"){ const ta=$("msg"); try { navigator.clipboard.writeText(ta.value).then(()=>{$("status").textContent=statusText("copy");},()=>{ta.select();$("status").textContent="Message selected. Use your device’s copy.";}); } catch { ta.select(); } }
    else $("status").textContent=statusText(d.ch);
  }
});
document.addEventListener("input",e=>{
  if (e.target.id==="budget"){ S.budget[S.mode||"rent"]=+e.target.value; $("budgetVal").textContent=money(budget())+(S.mode==="buy"?"":" / month");
    document.querySelectorAll("[data-budget]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.budget===budget()));
    S.done.add("budget"); const f=$("budgetFit"); if (f) f.textContent=`${pool().length} homes fit at this budget`; renderLive(); }
  if (e.target.id==="guestName"||e.target.id==="nameIn"){ S.name=e.target.value.trim().slice(0,40); if (e.target.id==="nameIn"&&$("askText")) askUpdate(); }
  if (e.target.id==="msg"){ S.msgEdited=true; S.msgDraft=e.target.value; $("resetMsg").hidden=false; links(); }
});

render();
</script>
